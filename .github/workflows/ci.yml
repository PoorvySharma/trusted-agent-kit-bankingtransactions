name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rule-harness:
    name: Detection rules (no org needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/rule-harness/run.py

  apex-tests:
    name: Deploy and run Apex tests in a scratch org
    runs-on: ubuntu-latest
    needs: rule-harness
    # Requires a repository secret SFDX_AUTH_URL for a Dev Hub
    # (sf org display --verbose --target-org <devhub> shows the Sfdx Auth Url).
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --global @salesforce/cli
      - name: Authenticate Dev Hub
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./authurl.txt
          sf org login sfdx-url --sfdx-url-file ./authurl.txt --alias devhub --set-default-dev-hub
          rm ./authurl.txt
      - run: sf org create scratch --definition-file config/project-scratch-def.json --alias tak-ci --duration-days 1 --wait 15
      - run: sf project deploy start --target-org tak-ci --wait 20
      - run: sf apex run test --target-org tak-ci --test-level RunLocalTests --code-coverage --result-format human --wait 20
      - if: always()
        run: sf org delete scratch --target-org tak-ci --no-prompt
